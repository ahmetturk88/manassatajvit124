<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم التسجيل بالمنصة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: url('WhatsApp Image 2025-01-16 at 4.17.35 PM (1).jpeg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            color: #333;
        }
        @media (max-width: 768px) {
            body {
                background-size: contain;
                background-attachment: scroll;
            }
        }
        .content {
            background-color: rgba(255, 255, 255, 0.9); /* خلفية نصف شفافة */
            padding: 20px;
            margin: 100px auto;
            width: 80%;
            max-width: 800px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h1 {
            font-size: 40px;
            color: #007BFF; /* لون النص */
        }
        p {
            font-size: 24px;
            color: #555;
        }
        .button {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            font-size: 20px;
            color: #fff;
            background-color: #007BFF;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>مرحبا بك في قسم التسجيل بالمنصة</h1>
        <p>يرجى اختيار القسم الذي ترغب في التسجيل به</p>
        <a href="https://docs.google.com/forms/d/1kKCQwJFlGbqujXoON54WhESpUZ6DOn3qQ-LyDiE3q-o/edit" class="button">اللغة العربية</a>
        <a href="https://docs.google.com/forms/d/1KGjCfXsAEgOIsiCpeTcFNbU9Uz7ShkjLytcDmoRKb3I/edit?pli=1" class="button">القرآن الكريم</a>
    </div>
</body>
</html>
